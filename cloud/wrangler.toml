name = "povoto-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# Preview URLs would be other hostnames, outside the Access application.
preview_urls = false

# The Povoto web pages (Povoto/data/www + LCars.bmp), copied by
# scripts/copy-assets.mjs into this ignored folder before dev/deploy.
# Every request goes to the Worker, which serves only the files it allows.
[assets]
directory = ".build/assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "povoto"
database_id = "bc593d01-012a-4f19-8b31-23111dc0b3b4"
migrations_dir = "migrations"

[vars]
# Cloudflare Access (cloud/README.md): team domain and the application AUD tag.
ACCESS_TEAM_DOMAIN = "https://brewtal.cloudflareaccess.com"
ACCESS_AUD = "9c65f46383702bbcd460690c95aea7c067362300899cd8665e3e952b7703785d"
# The Povotos' local time (NTPBegin(-3)), used for "updated N min ago".
LOCAL_UTC_OFFSET_MINUTES = "-180"
# The same Worker, on a second hostname that Access does not protect: only
# the SideKick ingest (token) and the public links (/s/...) work there; every
# other page still requires the Access login checked in the code.
PUBLIC_ORIGIN = "https://povoto-public.povoto-cloud.workers.dev"

[env.public]
name = "povoto-public"
workers_dev = true
preview_urls = false

[env.public.assets]
directory = ".build/assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[env.public.d1_databases]]
binding = "DB"
database_name = "povoto"
database_id = "bc593d01-012a-4f19-8b31-23111dc0b3b4"
migrations_dir = "migrations"

[env.public.vars]
ACCESS_TEAM_DOMAIN = "https://brewtal.cloudflareaccess.com"
ACCESS_AUD = "9c65f46383702bbcd460690c95aea7c067362300899cd8665e3e952b7703785d"
LOCAL_UTC_OFFSET_MINUTES = "-180"
PUBLIC_ORIGIN = "https://povoto-public.povoto-cloud.workers.dev"
