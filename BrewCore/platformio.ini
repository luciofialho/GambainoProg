; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; **********************************
;   BREWCORE
; **********************************

[platformio]
src_dir = .
build_dir = c:\ArduinoCompile\Brewcore

[env:esp32s3-debug]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

upload_speed = 460800

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

board_build.partitions = BrewCore-partitions.csv

build_flags =
    -DBREWCORE_ENABLE_BLE=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    marian-craciunescu/ESP32Ping@^1.7
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    adafruit/Adafruit INA219@^1.2.3
    h2zero/NimBLE-Arduino@^1.4.2

lib_extra_dirs = a:\Nuvem\Gambaino\Prog\Common


;build_flags = -DCORE_DEBUG_LEVEL=5
[env:BrewCore]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
;upload_port = COM5
;monitor_port = COM5
lib_deps = 
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	marian-craciunescu/ESP32Ping@^1.7
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	adafruit/Adafruit INA219@^1.2.3
	h2zero/NimBLE-Arduino@^1.4.2
lib_extra_dirs = a:\Nuvem\Gambaino\Prog\Common
board_build.partitions = BrewCore-partitions.csv
build_flags =
	-DBREWCORE_ENABLE_BLE=0


; To enable RAPT BLE integration, switch to:
; -DBREWCORE_ENABLE_BLE=1


;build_flags = -DCORE_DEBUG_LEVEL=5