[platformio]
default_envs = PovotoS3
src_dir = .
build_dir = c:\ArduinoCompile\Povoto


[env:Povoto]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.30
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    ricmoo/QRCode@^0.0.1
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0

lib_extra_dirs =
    a:\Nuvem\Gambaino\Prog\Common

lib_ignore =
    ESPAsyncWebServer
    ESPAsyncTCP
    RPAsyncTCP
    AsyncTCP

build_flags =
    -DUSER_SETUP_LOADED
    -include include/User_Setup.h
    -DAPP_PROJECT_NAME='"Povoto"'

board_build.filesystem = littlefs


[env:PovotoS3]
extends = env:Povoto

board = esp32-s3-devkitc-1

upload_protocol = esptool
upload_speed = 115200

build_flags =
    ${env:Povoto.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1


[env:PovotoS3PSRAM]
extends = env:PovotoS3

; Perfil alinhado ao projeto pequeno que funcionou na mesma placa.
board_build.arduino.memory_type = qio_opi

build_flags =
    ${env:PovotoS3.build_flags}
    -DBOARD_HAS_PSRAM
    -DUI_BMP_USE_PSRAM=1


[env:PovotoS3Debug]
extends = env:PovotoS3

build_type = debug

debug_tool = esp-builtin
debug_init_break = tbreak setup