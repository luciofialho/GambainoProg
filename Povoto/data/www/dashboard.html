<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>Povoto Dashboard</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-sizing: border-box; padding: 6px 4px 0; font: 12px Arial, Helvetica, sans-serif; color: #9aa3ad;
    }
    footer img { height: 40px; width: auto; display: block; filter: invert(1); opacity: .7; }
  </style>
</head>
<body>
  <canvas id="screen" width="480" height="320" aria-label="Povoto screen"></canvas>
  <footer id="footer">
    <span id="updated"></span>
    <img src="/assets/brewtal.svg" alt="Brewtal" onerror="this.hidden = true">
  </footer>
  <script src="dashboard.js"></script>
</body>
</html>
