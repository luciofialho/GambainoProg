<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16191e">
  <title>Povoto Dashboard</title>
  <style>
    /* Same frame and colors as the /graphs page. */
    html, body { margin: 0; height: 100%; background: #16191e; color: #e8edf3; overflow: hidden; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #page { display: flex; flex-direction: column; padding: 12px 16px; }
    .top { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; min-height: 30px; }
    .back { color: #a9b8d6; text-decoration: none; font-size: 15px; }
    .tools { margin-left: auto; display: flex; gap: 6px; }
    .tool { display: flex; align-items: center; justify-content: center; width: 34px; height: 30px; padding: 0;
            border: 1px solid #343d48; border-radius: 8px; background: #22272e; color: #a9b8d6; cursor: pointer; }
    .tool:hover { color: #e8edf3; border-color: #4b5869; }
    .tool[aria-pressed="true"] { background: #435e9a; border-color: #6e91dd; color: #f2f5fa; }
    .tool svg { width: 20px; height: 20px; }
    [hidden] { display: none !important; }
    .panel { background: #22272e; border: 1px solid #343d48; border-radius: 12px; padding: 14px; }
    canvas { display: block; }
    #updated { margin-top: 8px; font-size: 12px; color: #9aa3ad; text-align: right; }
    #updated:empty { display: none; }
    .signature { display: flex; justify-content: center; margin-top: 14px; }
    .signature img { width: 160px; max-width: 45%; height: auto; display: block; filter: invert(1); opacity: .7; }
  </style>
</head>
<body>
  <div id="page">
    <div class="top">
      <!-- Cloud only: target and text come from status.json (back). On the
           Povoto the dashboard is the home page and the menu icon shows. -->
      <a id="back" class="back" href="../" hidden>&larr; Back</a>
      <span class="tools">
        <button id="stats" class="tool" type="button" title="Statistics" aria-label="Statistics" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
        </button>
        <a id="menu" class="tool" href="../config" title="Menu" aria-label="Menu" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </a>
      </span>
    </div>
    <section class="panel">
      <canvas id="screen" width="480" height="320" aria-label="Povoto screen"></canvas>
      <div id="updated"></div>
    </section>
    <footer class="signature"><img src="/assets/brewtal.svg" alt="Brewtal" onerror="this.hidden = true"></footer>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
